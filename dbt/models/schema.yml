version: 2

models:
  - name: dim_delay_reason
    description: "Delay code dictionary, one row per mode + code."
    columns:
      - name: delay_code
        data_tests:
          - not_null
    data_tests:
      - unique:
          column_name: "mode || '-' || delay_code"

  - name: fct_delays
    description: "One row per delay event, with reason and derived fields."
    columns:
      - name: delay_id
        data_tests:
          - unique
          - not_null
      - name: delay_date
        data_tests:
          - not_null
      - name: mode
        data_tests:
          - accepted_values:
              values: ['subway']
      - name: line_name
        data_tests:
          - accepted_values:
              values: ['Line 1 Yonge-University', 'Line 2 Bloor-Danforth',
                       'Line 3 Scarborough', 'Line 4 Sheppard',
                       'Multiple lines', 'Unknown', 'Other / Unknown']
      - name: delay_code
        data_tests:
          - relationships:
              to: ref('dim_delay_reason')
              field: delay_code
              config:
                severity: warn
